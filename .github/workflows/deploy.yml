name: Deploy to GitHub Pages

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # --- build main site (…/camber/) ---
      - uses: actions/checkout@v5
        with:
          ref: main
      # setup-node comes after checkout so `cache: "npm"` can hash the committed lockfile
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run build

      # --- build v1 site (…/camber/v1/) ---
      - uses: actions/checkout@v5
        with:
          ref: v1
          path: v1
      - run: npm ci && npm run build && mv dist ../dist/v1
        working-directory: v1

      # --- build beta site (…/camber/beta/) ---
      # non-fatal unless this run was triggered from the `beta` branch.
      - uses: actions/checkout@v5
        continue-on-error: ${{ github.ref_name != 'beta' }}
        with:
          ref: beta
          path: beta
      - run: npm ci && npm run build && mv dist ../dist/beta
        continue-on-error: ${{ github.ref_name != 'beta' }}
        working-directory: beta

      # Upload the combined dist folder as an artifact for the deploy job
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
