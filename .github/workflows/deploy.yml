name: Deploy to GitHub Pages

on:
  push:
    branches: [main, beta] # a push to either branch deploys both
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # --- build main site (…/camber/) ---
      - uses: actions/checkout@v5
        with:
          ref: main
      # setup-node comes after checkout so `cache: "npm"` can hash the committed lockfile
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run build

      # --- build beta site (…/camber/beta/) ---
      # On a `main` push (or manual run from main), a broken beta is non-fatal: its
      # checkout/install/build may fail and main still deploys. On a `beta` push,
      # continue-on-error is false, so a broken beta fails the run.
      - uses: actions/checkout@v5
        continue-on-error: ${{ github.ref_name == 'main' }}
        with:
          ref: beta
          path: beta
      - run: npm ci
        continue-on-error: ${{ github.ref_name == 'main' }}
        working-directory: beta
      - id: beta_build
        run: npm run build
        continue-on-error: ${{ github.ref_name == 'main' }}
        working-directory: beta

      # Combine the main `dist/` and the beta `dist/` folders into a single folder
      - if: steps.beta_build.outcome == 'success'
        run: mkdir -p dist/beta && cp -r beta/dist/. dist/beta/

      # Upload the combined dist folder as an artifact for the deploy job
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
