name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci || npm install
      # The offline render harness is an isolated package with its own deps.
      # typecheck runs `tsc -p tools/preview`, so it needs those installed too.
      # Lockfile is gitignored, hence `install` not `ci`.
      - run: npm install --prefix tools/preview
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run formatcheck
      - run: npm test
