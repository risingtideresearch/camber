<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The library is the app's home page. This root file is just a redirect there, so visiting the site
         root (in dev, or on GitHub Pages) lands on the library. A relative URL resolves under any base. It is
         a Vite build input (see vite.config.ts) so it is emitted to the dist root; it has no module script.
         The page is intentionally blank, painted in the library's background color, so the redirect is
         seamless — it just looks like the library is loading. -->
    <meta http-equiv="refresh" content="0; url=./library.html" />
    <link rel="canonical" href="./library.html" />
    <title>Camber</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f7fafc; /* --bg, matches the library's page background */
      }
    </style>
  </head>
  <body></body>
</html>
